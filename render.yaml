# Render Blueprint: deploys EyeMe as a web service with a persistent disk for the
# SQLite database and profile pictures. (Render's free plan can't attach disks.)
services:
  - type: web
    name: eyeme
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: eyeme-data
      mountPath: /var/data
      sizeGB: 1
